<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">Mission Computer Fault-Response SoC</title>
  <desc id="desc">Heartbeat and fault inputs pass through a four-state safety controller to isolate unsafe outputs.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061716"/>
      <stop offset="1" stop-color="#0D302C"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#5EEAD4" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#5EEAD4"/>
    </marker>
  </defs>

  <rect width="480" height="360" fill="url(#bg)"/>
  <rect width="480" height="360" fill="url(#grid)"/>
  <rect x="20" y="20" width="440" height="320" rx="16" fill="#071F1D" stroke="#2DD4BF" stroke-opacity=".55" stroke-width="2"/>

  <text x="42" y="54" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.8">06 / TEAM · EDUCATIONAL PROTOTYPE</text>
  <text x="42" y="91" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="800">FAULT-RESPONSE SoC</text>
  <text x="42" y="118" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">MicroBlaze · AXI4-Lite · Verilog</text>

  <rect x="42" y="151" width="110" height="64" rx="9" fill="#0B2926" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="97" y="177" text-anchor="middle" fill="#BAE6FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">HEARTBEAT</text>
  <text x="97" y="197" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">FAULT INPUT</text>

  <rect x="185" y="143" width="120" height="80" rx="9" fill="#10302C" stroke="#F59E0B" stroke-width="2"/>
  <text x="245" y="174" text-anchor="middle" fill="#FDE68A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800">4-STATE</text>
  <text x="245" y="195" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800">SAFETY FSM</text>

  <rect x="338" y="151" width="100" height="64" rx="9" fill="#0B2926" stroke="#FB7185" stroke-width="1.5"/>
  <text x="388" y="177" text-anchor="middle" fill="#FECDD3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">OUTPUT</text>
  <text x="388" y="197" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">ISOLATION</text>

  <path d="M153 183H177" stroke="#5EEAD4" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M306 183H330" stroke="#5EEAD4" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="42" y="257" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">STATE</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">
    <rect x="42" y="270" width="82" height="28" rx="14" fill="#0F766E"/><text x="83" y="288" fill="#CCFBF1">NORMAL</text>
    <rect x="132" y="270" width="82" height="28" rx="14" fill="#92400E"/><text x="173" y="288" fill="#FEF3C7">WARNING</text>
    <rect x="222" y="270" width="88" height="28" rx="14" fill="#9A3412"/><text x="266" y="288" fill="#FFEDD5">DEGRADED</text>
    <rect x="318" y="270" width="120" height="28" rx="14" fill="#9F1239"/><text x="378" y="288" fill="#FFE4E6">SAFE_MODE</text>
  </g>

  <text x="42" y="324" fill="#99F6E4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">MY IP · SAFETY CONTROLLER</text>
</svg>
