<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Embedded Firmware Engineer profile banner</title>
  <desc id="desc">A dark teal circuit-inspired banner showing an embedded signal path from sensing to control.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061716"/>
      <stop offset="0.55" stop-color="#0A2421"/>
      <stop offset="1" stop-color="#0E332E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5EEAD4" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <path d="M0 272H770L804 238H890" fill="none" stroke="#2DD4BF" stroke-opacity="0.16" stroke-width="2"/>
  <path d="M1200 52H1088L1048 92H934" fill="none" stroke="#5EEAD4" stroke-opacity="0.14" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="76" y="62" fill="#5EEAD4" font-size="17" font-weight="700" letter-spacing="3">PARK GITAE / EMBEDDED SYSTEMS</text>
    <rect x="76" y="82" width="74" height="4" rx="2" fill="url(#accent)"/>

    <text x="76" y="151" fill="#F0FDFA" font-size="54" font-weight="800" letter-spacing="1">EMBEDDED FIRMWARE</text>
    <text x="76" y="213" fill="#F0FDFA" font-size="54" font-weight="800" letter-spacing="1">ENGINEER</text>

    <text x="78" y="257" fill="#99F6E4" font-size="18" font-weight="600" letter-spacing="1.3">STM32 · FREERTOS · CAN · MICROBLAZE SOC · EDGE AI</text>
    <text x="78" y="292" fill="#94A3B8" font-size="13" letter-spacing="1.8">DESIGN  /  IMPLEMENT  /  VERIFY</text>
  </g>

  <g transform="translate(868 91)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="0" y="0" width="260" height="150" rx="22" fill="#071F1D" stroke="#2DD4BF" stroke-opacity="0.38" stroke-width="2"/>

    <path d="M34 46H78M104 46H148M174 46H226M52 46V82H104M130 46V104H174M200 46V82H226" fill="none" stroke="#5EEAD4" stroke-opacity="0.46" stroke-width="2"/>
    <path d="M34 112H84L104 92M130 112H174L194 92H226" fill="none" stroke="#2DD4BF" stroke-opacity="0.34" stroke-width="2"/>

    <g fill="#0F766E" stroke="#5EEAD4" stroke-width="2">
      <circle cx="34" cy="46" r="7"/>
      <circle cx="91" cy="46" r="12"/>
      <circle cx="161" cy="46" r="12"/>
      <circle cx="226" cy="46" r="7"/>
      <circle cx="104" cy="92" r="7"/>
      <circle cx="194" cy="92" r="7"/>
      <circle cx="34" cy="112" r="7"/>
      <circle cx="226" cy="112" r="7"/>
    </g>

    <circle cx="91" cy="46" r="4" fill="#99F6E4" filter="url(#glow)"/>
    <circle cx="161" cy="46" r="4" fill="#99F6E4" filter="url(#glow)"/>

    <text x="20" y="136" fill="#64748B" font-size="11" letter-spacing="1.2">SENSE</text>
    <text x="82" y="136" fill="#64748B" font-size="11" letter-spacing="1.2">DECIDE</text>
    <text x="155" y="136" fill="#64748B" font-size="11" letter-spacing="1.2">CONNECT</text>
    <text x="216" y="136" fill="#64748B" font-size="11" letter-spacing="1.2">ACT</text>
  </g>

  <circle cx="1138" cy="274" r="4" fill="#5EEAD4" filter="url(#glow)"/>
  <circle cx="1158" cy="274" r="4" fill="#2DD4BF" opacity="0.65"/>
</svg>
